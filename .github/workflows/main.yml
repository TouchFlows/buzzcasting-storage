name: Main

on: [push, pull_request]

jobs:
  main:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      # The credential-guard tests scan for real secrets, and they fail rather
      # than skip when the scanner is missing, so CI has to provide it.
      - name: Install gitleaks
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          version=8.30.1
          case "$(uname -m)" in
            x86_64) arch=x64 ;;
            arm64 | aarch64) arch=arm64 ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v$version/gitleaks_${version}_${os}_${arch}.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          gitleaks version
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test
