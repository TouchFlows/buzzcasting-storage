name: Main

on: [push, pull_request]

jobs:
  main:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      # The credential-guard tests scan for real secrets, and they fail rather
      # than skip when the scanner is missing, so CI has to provide it.
      - name: Install gitleaks
        if: runner.os != 'Windows'
        run: |
          bash scripts/install-gitleaks.sh --dir "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/gitleaks" version
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test

  # Shared with the other active repositories, so a --no-verify push there is
  # scanned by the same rules and the same guard version.
  secret-scan:
    name: secret scan
    uses: ./.github/workflows/secret-scan.yml
