name: Secret scan

# The pre-push hook only guards machines that installed it, and `git push
# --no-verify` skips it anywhere. This scans the commits the push actually
# publishes, so an unscanned token cannot reach the remote just because it was
# committed on a machine without the hook.
#
# Called by this repository's main workflow, and by the other active repositories
# with `uses: TouchFlows/buzzcasting-storage/.github/workflows/secret-scan.yml@main`.
# The caller checks out only its own repository, so the guard is fetched from this
# one at the same ref; GitHub serves this repository publicly, so no token is
# needed and rules, range handling and the pinned scanner version stay in one place.
on: workflow_call

env:
  GUARD_REPO: TouchFlows/buzzcasting-storage
  # Matches the @main the callers use, so the workflow and the guard it runs move
  # together. Pin both to a commit to freeze them.
  GUARD_REF: main

jobs:
  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A range needs the commits on both sides of it, and a force-push can
          # drop the previous tip, so keep the full history.
          fetch-depth: 0
      - name: Fetch the credential guard
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/guard"
          for file in check-git-credentials.sh install-gitleaks.sh gitleaks.toml; do
            curl -fsSL --retry 3 "https://raw.githubusercontent.com/${GUARD_REPO}/${GUARD_REF}/scripts/${file}" \
              -o "$RUNNER_TEMP/guard/${file}"
          done
          chmod +x "$RUNNER_TEMP/guard/check-git-credentials.sh"
      - name: Install gitleaks
        run: |
          bash "$RUNNER_TEMP/guard/install-gitleaks.sh" --dir "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/gitleaks" version
      - name: Scan the commits this push publishes
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/tools/gitleaks
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "scanning the pull request: ${PR_BASE:-<new>}..HEAD"
            if [ -n "${PR_BASE:-}" ] && git rev-parse --verify --quiet "$PR_BASE^{commit}" >/dev/null; then
              range="$PR_BASE..HEAD"
            else
              range="HEAD"
            fi
          else
            before="${PUSH_BEFORE:-}"
            case "$before" in
              0000000000000000000000000000000000000000) before="" ;;
            esac
            # No previous tip on a new branch, and a force-push may have dropped
            # it; scanning everything reachable from HEAD is the safe fallback.
            if [ -n "$before" ] && git rev-parse --verify --quiet "$before^{commit}" >/dev/null; then
              range="$before..HEAD"
            else
              echo "no previous tip reachable; scanning all history reachable from HEAD"
              range="HEAD"
            fi
          fi
          echo "scanning $range"
          bash "$RUNNER_TEMP/guard/check-git-credentials.sh" --range "$range" "$PWD" "$PWD"
